[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myapp"
version = "0.1.0"

[project.optional-dependencies]
eval = ["pytest>=7.4", "openai>=1.50", "python-dotenv>=1", "jsonschema>=4.20", "pydantic>=2"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: calls DeepSeek for an end-to-end evaluation"]
